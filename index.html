<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 歌单查找 · 音乐小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
        }
        body {
            background: #f2f0f5;
            min-height: 100vh;
            transition: background 0.3s ease;
            padding-bottom: 3rem;
        }
        /* 主容器 */
        .app {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }
        /* ----- 导航栏 ----- */
        .navbar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 12px 24px;
            margin: 20px 0 30px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            background: linear-gradient(145deg, #2b2d42, #4a4e6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-brand span {
            background: #1e1f2b;
            color: white;
            -webkit-text-fill-color: white;
            background: #2b2d42;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            line-height: 24px;
            margin-left: 4px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
            margin: 6px 0;
        }
        .nav-links a {
            text-decoration: none;
            color: #1e1f2b;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 0;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .nav-links a:hover {
            border-bottom-color: #4a4e6b;
            color: #000;
        }
        .nav-links .genre-tag {
            background: rgba(42, 44, 66, 0.06);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            border-bottom: none;
            transition: 0.15s;
        }
        .nav-links .genre-tag:hover {
            background: rgba(42, 44, 66, 0.15);
            border-bottom: none;
            transform: translateY(-1px);
        }
        /* 背景色控制器 */
        .bg-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.02);
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .bg-control label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #2b2d42;
            opacity: 0.7;
        }
        .bg-control input[type="color"] {
            width: 34px;
            height: 34px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 40px;
            cursor: pointer;
            background: none;
            padding: 2px;
        }
        .bg-control input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .bg-control input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 40px;
        }
        /* ----- 双栏布局: 左(照片+简介) 右(搜索+列表) ----- */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 28px;
            margin-top: 10px;
        }
        @media (max-width: 760px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .navbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                border-radius: 32px;
                padding: 16px 20px;
            }
            .nav-links {
                justify-content: center;
            }
            .bg-control {
                align-self: flex-end;
                margin-top: 4px;
            }
        }
        /* ----- 左侧卡片: 照片 + 信息 ----- */
        .photo-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 22px 18px 26px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            transition: all 0.2s;
            height: fit-content;
        }
        .photo-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 24px;
            overflow: hidden;
            background: #d9d5e0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-frame .placeholder-icon {
            font-size: 4rem;
            opacity: 0.3;
            color: #5a5e7a;
        }
        .photo-caption {
            font-weight: 500;
            color: #1e1f2b;
            letter-spacing: 0.2px;
            font-size: 1rem;
            margin-top: 6px;
            background: rgba(255,255,255,0.3);
            padding: 8px 8px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
        }
        .photo-sub {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 2px;
        }
        /* ----- 右侧: 搜索 + 歌单列表 ----- */
        .search-section {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 24px 24px 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
        }
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 180px;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid rgba(0,0,0,0.04);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .search-bar input:focus {
            border-color: #6b6f8b;
            background: white;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
        }
        .search-bar button {
            background: #2b2d42;
            border: none;
            color: white;
            font-weight: 500;
            padding: 0 32px;
            border-radius: 60px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(43, 45, 66, 0.15);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .search-bar button:hover {
            background: #1e1f2b;
            transform: scale(0.97);
        }
        .song-list-container {
            max-height: 560px;
            overflow-y: auto;
            padding-right: 6px;
            margin-top: 6px;
        }
        .song-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .song-list-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
        }
        .song-list-container::-webkit-scrollbar-thumb {
            background: #b8bace;
            border-radius: 10px;
        }
        .song-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 60px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
            margin-bottom: 6px;
            transition: 0.1s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .song-item:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255,255,255,0.3);
        }
        .song-index {
            font-weight: 400;
            color: #4a4e6b;
            opacity: 0.5;
            font-size: 0.8rem;
            min-width: 28px;
        }
        .song-name {
            font-weight: 500;
            color: #1a1b26;
            font-size: 0.98rem;
        }
        .song-name small {
            font-weight: 300;
            opacity: 0.4;
            margin-left: 8px;
            font-size: 0.7rem;
        }
        .no-result {
            padding: 30px 10px;
            text-align: center;
            opacity: 0.5;
            font-style: italic;
        }
        .stats {
            margin-top: 16px;
            font-size: 0.8rem;
            opacity: 0.5;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid rgba(0,0,0,0.03);
            padding-top: 16px;
        }
        .badge {
            background: #2b2d42;
            color: white;
            padding: 2px 14px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 导航栏 -->
        <nav class="navbar" id="navbar">
            <div class="nav-brand">
                 歌单·岛
                <span>v1</span>
            </div>
            <div class="nav-links" id="genreNav">
                <!-- 由 js 动态生成，保留默认硬编码 -->
                <a href="#" class="genre-tag" data-genre="全部"> 全部</a>
                <a href="#" class="genre-tag" data-genre="流行"> 流行</a>
                <a href="#" class="genre-tag" data-genre="古风"> 古风</a>
                <a href="#" class="genre-tag" data-genre="民谣">🪕 民谣</a>
                <a href="#" class="genre-tag" data-genre="电子">️ 电子</a>
                <a href="#" class="genre-tag" data-genre="影视"> 影视</a>
            </div>
            <div class="bg-control">
                <label for="bgPicker"> 背景</label>
                <input type="color" id="bgPicker" value="#f2f0f5">
            </div>
        </nav>
        <!-- 主网格 -->
        <div class="main-grid">
            <!-- 左侧 照片卡片 -->
            <aside class="photo-card">
                <div class="photo-frame" id="photoFrame">
                    <!-- 默认显示一个占位头像，可替换为 img -->
                    <span class="placeholder-icon"></span>
                    <!-- 如需要显示图片，取消注释下面一行并注释上面占位 -->
                    <!-- <img src="https://picsum.photos/400/400?random=1" alt="歌单封面"> -->
                </div>
                <div class="photo-caption">
                     月下歌单
                </div>
                <div class="photo-sub">
                     点击更换照片 (双击)
                </div>
            </aside>
            <!-- 右侧 搜索+列表 -->
            <section class="search-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索歌曲、歌手、风格..." value="">
                    <button id="searchBtn"> 查找</button>
                </div>
                <div class="song-list-container" id="songListContainer">
                    <!-- 动态渲染歌单 -->
                    <div id="songList"></div>
                </div>
                <div class="stats">
                    <span id="songCount">0 首</span>
                </div>
            </section>
        </div>
    </div>
    <script>
        (function(){
            // ------- 原始歌单数据 (来自 歌单1.txt) -------
            const rawSongs = [
                "谁", "Doll", "探窗", "婚约", "大喜", "谁家", "可能", "天才", "澎湃", "慢慢",
                "旋木", "像鱼", "暖暖", "大鱼", "苍耳", "走马", "平庸", "不怕", "再见", "记得",
                "续雪", "雨爱", "大眠", "贪慕", "年轮", "迷鹿", "借过", "我曾", "落款", "下潜",
                "演员", "她说", "撒野", "冬眠", "嘉宾", "侧脸", "过火", "夜车", "白羊", "传奇",
                "房间", "小孩", "直觉", "对视", "虚拟", "小半", "听海", "冲动", "i love u", "两三句",
                "燕回巷", "伯虎说", "广寒宫", "小年兽", "牵丝戏", "凑热闹", "苏州河", "口头禅",
                "我会等", "七月上", "闹哄哄", "试试吧", "声声慢", "可能否", "太委屈", "我想念",
                "愿与愁", "下雨了", "他不懂", "虹之间", "我走后", "我会等", "想某人", "我害怕",
                "我和你", "虫儿飞", "相思遥", "时间轴", "追光者", "我知道", "我看过", "一点点",
                "小模样", "爱一点", "第一天", "小尾巴", "醉清风", "小幸运", "霸王别姬", "一笑倾城",
                "万有引力", "我想我会", "爱的魔法", "告白气球", "明天过后", "夏天的风", "气象站台",
                "小镇姑娘", "茶花开了", "连名带姓", "无人之岛", "字字句句", "忽而今夏", "说好不哭",
                "天外来物", "如果可以", "那个夏天", "寂寞烟火", "忘了没有", "想想念念", "颠倒之间",
                "好久不见", "忘记时间", "就忘了吧", "失落沙洲", "我很快乐", "不再联系", "像风一样",
                "身骑白马", "情字最大", "错位时空", "一路生花", "勾指起誓", "今夜有雨", "后会无期",
                "晴天和猫", "情非得已", "忽然之间", "熬夜上瘾", "一半一半", "荷塘月色", "明天,你好",
                "他乡的月亮", "辞九门回忆", "人间惊鸿宴", "新贵妃醉酒", "泼天的富贵", "爱的感叹号",
                "陪你看星星", "空山新雨后", "恶龙与小熊", "已经有我啦", "奇妙能力歌", "会呼吸的痛",
                "爱我还是他", "突然好想你", "想你时风起", "小了白了兔", "会开花的云", "没那么简单",
                "只是太爱你", "新梅花三弄", "亲爱的你啊", "踮起脚尖爱", "等一场大雨", "快乐的扑满",
                "阳光下的星星", "暗恋这件小事", "有可能的夜晚", "推开世界的门", "梦雨星海之间",
                "化身孤岛的鲸", "阿拉斯加海湾", "离开我的依赖", "如晴天似雨天", "我还有点小糊涂",
                "晚夜微雨问海棠", "请你吃个冰激凌", "白月光与朱砂痣", "像你这样的朋友",
                "酸酸甜甜就是我", "你的眼睛像星星", "好像要牵你的手", "山外小楼夜听雨",
                "这世界那么多人", "我期待的不是雪", "第57次取消发送", "我恨明月不照我",
                "我变了，我没变", "云朵变成棉花糖", "一个人想着一个人", "在加纳共和国离婚",
                "就让这大雨全都落下", "我多喜欢你，你会知道", "我喜欢你时内心的活动",
                "无论你多怪异我还是会喜欢你", "失控", "阿嬷", "宝贝", "褪黑素", "你是我的小狗",
                "老公公老婆婆"
            ];
            // 去除可能的空字符串，以及特殊 "舰长：" 行处理 (实际歌单没有单独 "舰长：" 条目，但保留纯净)
            const songList = rawSongs.filter(s => s && s.trim() !== '' && !s.includes('舰长'));
            // ---------- DOM 引用 ----------
            const songListEl = document.getElementById('songList');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const songCountEl = document.getElementById('songCount');
            const bgPicker = document.getElementById('bgPicker');
            const photoFrame = document.getElementById('photoFrame');
            // 当前激活的 genre (分类)
            let currentGenre = '全部';
            // 当前搜索关键词
            let currentKeyword = '';
            // ---------- 渲染函数 ----------
            function renderSongs(filteredSongs) {
                if (!filteredSongs || filteredSongs.length === 0) {
                    songListEl.innerHTML = `<div class="no-result"> 没有找到歌曲，换个关键词吧</div>`;
                    songCountEl.textContent = `0 首`;
                    return;
                }
                let html = '';
                filteredSongs.forEach((song, idx) => {
                    // 给部分歌曲加个风格小标记 (仅展示)
                    const tag = (idx % 5 === 0) ? ' ♪' : '';
                    html += `
                        <div class="song-item">
                            <span class="song-index">#${idx+1}</span>
                            <span class="song-name">${song}${tag}</span>
                        </div>
                    `;
                });
                songListEl.innerHTML = html;
                songCountEl.textContent = `${filteredSongs.length} 首`;
            }
            // 核心过滤: 根据关键词 + 分类 (分类目前为模拟, 但保留扩展)
            function filterSongs(keyword, genre) {
                let result = [...songList];
                // 关键词过滤 (不区分大小写)
                if (keyword.trim() !== '') {
                    const kw = keyword.trim().toLowerCase();
                    result = result.filter(song => song.toLowerCase().includes(kw));
                }
                // 分类过滤 (模拟：因为歌单没有明确分类，用风格标签简单模拟)
                // 为了展示分类效果，根据歌曲名字包含某些词模拟分类 (纯展示)
                if (genre && genre !== '全部') {
                    const genreMap = {
                        '流行': ['爱','我','你','的','了','风','雨','天','心','光','星','月','梦','海','云','雪','花'],
                        '古风': ['辞','贵妃','琵琶','海棠','白月光','朱砂','惊鸿','戏','梅花','伯虎','燕','巷','广寒','牵丝','相思','人间','晚夜','微雨','山外','小楼','夜听','雨'],
                        '民谣': ['南方','北方','小镇','姑娘','七月','上','走马','小半','房间','小孩','苍耳','平庸','再见','记得','慢慢','可能','谁','Doll'],
                        '电子': ['Doll','i love u','引力','气泡','旋木','像鱼','大鱼','虚拟','冲动','小年兽','小幸运','万有引力','晴天','猫'],
                        '影视': ['霸王别姬','新贵妃醉酒','辞九门回忆','白月光与朱砂痣','让大雨落下','加纳共和国','推开世界的门','忽然之间','明天过后','说好不哭','天外来物','阿拉斯加海湾']
                    };
                    const keywords = genreMap[genre] || [];
                    if (keywords.length > 0) {
                        result = result.filter(song => 
                            keywords.some(kw => song.includes(kw))
                        );
                    }
                }
                return result;
            }
            // 更新视图 (基于当前 keyword 和 genre)
            function updateView() {
                const filtered = filterSongs(currentKeyword, currentGenre);
                renderSongs(filtered);
            }
            // ---------- 事件绑定 ----------
            // 搜索按钮
            searchBtn.addEventListener('click', function() {
                currentKeyword = searchInput.value;
                updateView();
            });
            // 回车搜索
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    currentKeyword = searchInput.value;
                    updateView();
                }
            });
            // 导航分类点击 (使用事件委托)
            document.getElementById('genreNav').addEventListener('click', function(e) {
                const target = e.target.closest('.genre-tag');
                if (!target) return;
                e.preventDefault();
                const genre = target.dataset.genre;
                if (genre) {
                    currentGenre = genre;
                    // 高亮样式 (简单处理)
                    document.querySelectorAll('.genre-tag').forEach(tag => {
                        tag.style.background = 'rgba(42,44,66,0.06)';
                        tag.style.color = '#1e1f2b';
                    });
                    target.style.background = 'rgba(42,44,66,0.2)';
                    target.style.color = '#000';
                    // 重新搜索
                    updateView();
                }
            });
            // 背景颜色
            bgPicker.addEventListener('input', function(e) {
                document.body.style.background = e.target.value;
            });
            // 初始背景色同步
            document.body.style.background = bgPicker.value;
            // 双击照片区域更换图片 (使用 picsum 随机)
            photoFrame.addEventListener('dblclick', function() {
                const img = document.createElement('img');
                img.src = 'https://picsum.photos/400/400?random=' + Date.now();
                img.alt = '歌单封面';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                // 清空并放入图片
                photoFrame.innerHTML = '';
                photoFrame.appendChild(img);
            });
            // 初始化 默认全部显示
            currentGenre = '全部';
            currentKeyword = '';
            searchInput.value = '';
            // 默认高亮全部
            document.querySelector('.genre-tag[data-genre="全部"]').style.background = 'rgba(42,44,66,0.2)';
            updateView();
            // 附加：导航栏增加一个小功能 — 点击导航分类也清空搜索框? 不强制，保留关键词配合。
